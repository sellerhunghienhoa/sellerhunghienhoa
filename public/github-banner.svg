    </text>

    <!-- Tech & Architecture Pills -->
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="168" height="36" rx="18" fill="#ffffff" stroke="#1e2252" stroke-width="2.5"/>
      <text x="84" y="23" text-anchor="middle" fill="#283593" font-family="system-ui, sans-serif" font-weight="800" font-size="13">⚡ Cloudflare Edge</text>

      <rect x="180" y="0" width="168" height="36" rx="18" fill="#ffffff" stroke="#1e2252" stroke-width="2.5"/>
      <text x="264" y="23" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-weight="800" font-size="13">🟢 Supabase DB/Auth</text>

      <rect x="360" y="0" width="156" height="36" rx="18" fill="#ffffff" stroke="#1e2252" stroke-width="2.5"/>
      <text x="438" y="23" text-anchor="middle" fill="#9a3412" font-family="system-ui, sans-serif" font-weight="800" font-size="13">📦 R2 Storage</text>

      <rect x="528" y="0" width="176" height="36" rx="18" fill="#c81e5b" stroke="#1e2252" stroke-width="2.5"/>
      <text x="616" y="23" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="13">🤖 Agent-Ready 100</text>
    </g>

