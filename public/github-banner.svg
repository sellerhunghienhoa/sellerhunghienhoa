    <!-- Main Title -->
    <text x="0" y="106" fill="#283593" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="-1">
      Unboxing Portfolio
    </text>
    <text x="0" y="148" fill="#1e2252" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22">
