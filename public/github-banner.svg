  </defs>

  <!-- Cream Studio Paper Background -->
  <rect width="1200" height="380" rx="24" fill="#f4f5fb"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect x="8" y="8" width="1184" height="364" rx="18" fill="none" stroke="#1e2252" stroke-width="4"/>

  <!-- Top Magenta Studio Ribbon -->
  <rect x="8" y="8" width="1184" height="38" rx="14" fill="#c81e5b"/>
  <text x="600" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="2">
    ✦ UNBOXING PORTFOLIO STUDIO · HÙNG HIỀN HOÀ (HUNGHIENHOA2110) · GITHUB × SUPABASE × CLOUDFLARE R2 ✦
  </text>

  <!-- Left Content Column -->
  <g transform="translate(64, 88)">
    <!-- Yellow Sticker Badge -->
    <g transform="rotate(-2)">
      <rect x="0" y="0" width="330" height="38" rx="8" fill="#ffe359" stroke="#1e2252" stroke-width="3"/>
      <text x="165" y="25" text-anchor="middle" fill="#1e2252" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="0.8">
