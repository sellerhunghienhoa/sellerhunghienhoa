      <text x="38" y="33" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">01–06</text>
    </g>
    <g transform="translate(142, 4) rotate(12)">
      <rect x="0" y="0" width="58" height="44" rx="8" fill="#283593" stroke="#1e2252" stroke-width="3"/>
      <text x="29" y="28" text-anchor="middle" fill="#ffe359" font-family="system-ui, sans-serif" font-weight="900" font-size="16">3D ✦</text>
    </g>
