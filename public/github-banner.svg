    <!-- Left Flap -->
    <polygon points="15,75 65,25 125,45 125,95" fill="#e8c391" stroke="#1e2252" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Right Flap -->
    <polygon points="125,45 185,25 235,75 125,95" fill="#d9ab73" stroke="#1e2252" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Box Front Left -->
    <polygon points="25,75 125,98 125,215 25,188" fill="url(#boxSide)" stroke="#1e2252" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Box Front Right -->
    <polygon points="125,98 225,75 225,188 125,215" fill="#b77f46" stroke="#1e2252" stroke-width="3.5" stroke-linejoin="round"/>
