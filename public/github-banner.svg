<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" role="img" aria-label="Hùng Hiền Hoà — 3D Unboxing Graphic Design Portfolio">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#283593" stroke-width="1" stroke-opacity="0.1"/>
    </pattern>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c391"/>
      <stop offset="100%" stop-color="#c9935b"/>
